name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror

      - name: Test
        run: dotnet test LinML.slnx -c Release --no-build -m:1 --logger "console;verbosity=normal"

      - name: Publish (linux-x64)
        run: |
          dotnet restore src/LinML.Cli/LinML.Cli.csproj -r linux-x64 --locked-mode
          dotnet publish src/LinML.Cli/LinML.Cli.csproj -c Release -r linux-x64 --self-contained false -o artifacts/publish/linux-x64 --no-restore

      - name: Verify publish
        run: bash scripts/verify-linux-publish.sh artifacts/publish/linux-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linml-linux-x64
          path: artifacts/publish/linux-x64
          retention-days: 7

  gpu-tests:
    name: GPU Tests (hosted, CUDA skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror

      - name: Test (with GPU)
        run: dotnet test LinML.slnx -c Release --no-build -m:1 --filter "Category=GPU|FullyQualifiedName~Cuda"
