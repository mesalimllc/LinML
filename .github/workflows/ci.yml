name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror

      - name: Test
        run: dotnet test LinML.slnx -c Release --no-build -m:1 --logger "console;verbosity=normal"

      - name: Publish (linux-x64)
        run: |
          dotnet restore src/LinML.Cli/LinML.Cli.csproj -r linux-x64 --locked-mode
          dotnet publish src/LinML.Cli/LinML.Cli.csproj -c Release -r linux-x64 --self-contained false -o artifacts/publish/linux-x64 --no-restore

      - name: Verify publish (linux-x64)
        run: bash scripts/verify-linux-publish.sh artifacts/publish/linux-x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Test Python bindings
        run: |
          PYTHONPATH=bindings/python pytest bindings/python/tests

      - name: Upload artifacts (linux-x64)
        uses: actions/upload-artifact@v7
        with:
          name: linml-linux-x64
          path: artifacts/publish/linux-x64
          retention-days: 7

  build-and-test-arm64:
    name: Build and Test (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror

      - name: Test
        run: dotnet test LinML.slnx -c Release --no-build -m:1 --logger "console;verbosity=normal"

      - name: Publish (linux-arm64)
        run: |
          dotnet restore src/LinML.Cli/LinML.Cli.csproj -r linux-arm64 --locked-mode
          dotnet publish src/LinML.Cli/LinML.Cli.csproj -c Release -r linux-arm64 --self-contained false -o artifacts/publish/linux-arm64 --no-restore

      - name: Verify publish (linux-arm64)
        run: bash scripts/verify-linux-publish.sh artifacts/publish/linux-arm64

      - name: Upload artifacts (linux-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: linml-linux-arm64
          path: artifacts/publish/linux-arm64
          retention-days: 7

  gpu-tests:
    name: GPU Tests (hosted, CUDA skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror

      - name: Test (with GPU)
        run: dotnet test LinML.slnx -c Release --no-build -m:1 --filter "Category=GPU|FullyQualifiedName~Cuda"
