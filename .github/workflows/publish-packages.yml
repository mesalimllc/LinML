name: Publish packages

# Publishes LinML.Contracts and LinML.Catalog to GitHub Packages
# (https://nuget.pkg.github.com/trackdubllc/index.json).
#   - Push a tag vX.Y.Z or vX.Y.Z-preview.N, or
#   - run manually with an explicit version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0-preview.1)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${REF_NAME#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '$v'" >&2; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Restore (locked mode)
        run: dotnet restore LinML.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build LinML.slnx -c Release --no-restore -m:1 -warnaserror -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test LinML.slnx -c Release --no-build -m:1

      - name: Pack
        run: dotnet pack LinML.slnx -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.value }}

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate
